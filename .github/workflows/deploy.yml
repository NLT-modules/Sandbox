# This file was created automatically with `myst init --gh-pages` 🪄 💚

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  # You may need to change this to `BASE_URL: ''`
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install MyST Markdown
        run: npm install -g mystmd

      # Bouwen van boek met pdf

      - name: Install LaTeX tools
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex latexmk texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra


      #- name: Install tectonic via curl
      # -  uses: wtfjoke/setup-tectonic@v3 #https://github.com/marketplace/actions/setup-tectonic
      # - name: Install LaTeX tools (incl. latexmk)
        # run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      #-  run: tectonic main.tex
      - name: Build and export pdf 
        run: myst build --pdf
      - name: Find and move PDF
        run: |
          mkdir -p Exports
          find _build -name '*.pdf' -exec cp {} Exports/Boek.pdf \;

      - name: Commit en push Exports-folder
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Exports/Boek.pdf
          git commit -m "📦 Update Boek.pdf (auto-export)"
          git push


     # Bouwen van de site   
      - name: Build HTML Assets
        run: myst build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
